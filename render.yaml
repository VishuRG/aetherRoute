services:
  - type: web
    name: aetherroute-frontend
    runtime: node
    plan: free
    buildCommand: npm install --prefix frontend
    startCommand: npm run dev:frontend
    envVars:
      - key: NODE_ENV
        value: development
      - key: VITE_BACKEND_URL
        value: https://aetherroute-backend.vercel.app
